name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

  pull-requests: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clang-format:
    name: Clang Format
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:

          fetch-depth: 0
      - name: Run clang-format
        uses: cpp-linter/cpp-linter-action@v2
        id: linter
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          version: '22'
          style: file
          tidy-checks: '-*'
          file-annotations: true
          files-changed-only: 'true'
          ignore-format: 'src/contrib'

          lines-changed-only: 'diff'
      - name: Fail on format issues
        if: steps.linter.outputs.checks-failed > 0
        run: |
          echo "::error::${{ steps.linter.outputs.checks-failed }} formatting issue(s) found"
          exit 1

  reuse:
    name: REUSE Compliance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:

          fetch-depth: 0
      - name: Check changed files for REUSE compliance
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            BASE_SHA="$(git rev-parse "${HEAD_SHA}^" 2>/dev/null || true)"
          fi

          if [[ -z "$BASE_SHA" ]]; then
            echo "No base commit was available; nothing to check."
            exit 0
          fi

          git cat-file -e "${BASE_SHA}^{commit}"
          git cat-file -e "${HEAD_SHA}^{commit}"

          mapfile -d '' -t changed_files < <(
            git diff --name-only --diff-filter=ACMR -z "$BASE_SHA" "$HEAD_SHA"
          )

          if (( ${#changed_files[@]} == 0 )); then
            echo "No changed files require REUSE validation."
            exit 0
          fi

          printf 'Checking REUSE metadata for %s changed file(s).\n' "${#changed_files[@]}"

          docker run --rm \
            --volume "$PWD:/data:ro" \
            --workdir /data \
            fsfe/reuse:6 \
            lint-file -- "${changed_files[@]}"

      - name: Full repository REUSE audit
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        run: docker run --rm --volume "$PWD:/data:ro" --workdir /data fsfe/reuse:6 lint
